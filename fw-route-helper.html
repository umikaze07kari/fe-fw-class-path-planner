document.getElementById("charList").onclick=e=>{const id=e.target.dataset.rosterToggle;if(id)toggleMember(id);};
document.getElementById("members").onchange=e=>{const el=e.target,m=state.teams[active].find(x=>x.id===el.dataset.id);if(!m)return;if(el.dataset.action==="path"){if(el.value==="custom")return openCustomConfig(m.id);m.path=+el.value;m.target=(pathOptions(characterById[m.id])[m.path]?.steps.length||1)-1;}if(el.dataset.action==="skill")m.skills[el.dataset.skill]=el.value;save();render();};
document.getElementById("members").onclick=e=>{const el=e.target;if(el.dataset.action==="remove")remove(el.dataset.id);if(el.dataset.action==="route-menu")openRouteMenu(el.dataset.id);if(el.dataset.action==="edit-route")openMemberRouteConfig(el.dataset.id);};
render();
</script>
<script>
(()=>{
  const TEAM_GROUP_ICONS={
    kai:'img/team-icon/clan_1_pc_利贝拉之风.avif',
    dietrich:'img/team-icon/clan_2_pc_拉弥努家族.avif',
    theodora:'img/team-icon/clan_3_pc_美盖拉的灯火.avif',
    leda:'img/team-icon/clan_4_pc_蔷薇风暴.avif',
    'flame-mane':'img/team-icon/clan_5_pc_炎之鬃.avif',
    'moon-lies':'img/team-icon/clan_6_pc_月之谎言.avif',
    'hime-snapdragon':'img/team-icon/clan_7_pc_姬金鱼草的朝露.avif',
    'white-raven':'img/team-icon/clan_8_pc_白鸦新娘团.avif'
  };
  const ALL_CHARACTER_GROUPS=CHARACTER_GROUP_DISPLAY_ORDER;
  const groupForHeading=heading=>ALL_CHARACTER_GROUPS.find(group=>(isJa()?group[2]:group[1])===heading);
  const groupPreviewMembers=group=>{
    const ids=group[3]?.length?group[3]:CHARACTERS.filter(character=>saviorRosterGroup(character)===group[0]).map(character=>character.id);
    return ids.slice(0,5).map(id=>characterById[id]).filter(Boolean);
  };

  document.head.insertAdjacentHTML('beforeend',`<style>
    #charList.savior-list,.config-character-list{display:block;padding:7px}
    .team-group-card-grid{display:grid;gap:7px}
    .team-group-card-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    #fCharacterPicker.sim-character-picker{margin-top:13px!important}
    .team-group-accordion{margin:0!important;padding:0!important;border:1px solid var(--line)!important;border-radius:8px!important;background:#fffdf8!important;overflow:hidden}
    .team-group-heading{margin:0!important;padding:0!important;border:0!important}
    .team-group-toggle{display:flex;width:100%;min-height:54px;align-items:center;gap:7px;padding:4px 7px;border:0;border-radius:0;background:#f7f4ed;color:var(--navy);text-align:left}
    .team-group-toggle:hover,.team-group-accordion.is-open .team-group-toggle{background:#e6f0ec}
    .team-group-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
    .team-group-members{display:flex;align-items:center;margin-left:auto;padding-left:2px}.team-group-members .avatar{width:20px;height:20px;margin-left:-5px;border:2px solid #f7f4ed;background:#dbe4df}.team-group-toggle:hover .team-group-members .avatar,.team-group-accordion.is-open .team-group-members .avatar{border-color:#e6f0ec}
    .team-group-logo{display:block;flex:0 0 58px;width:58px;height:46px;overflow:hidden;border-radius:5px;background:#e6ebe8}
    .team-group-logo-spacer{display:block;flex:0 0 58px;width:58px}
    .team-group-logo img{display:block;width:100%;height:auto;min-height:100%;object-fit:cover;object-position:center top}
    .team-group-logo[data-team-group-logo="flame-mane"] img,.team-group-logo[data-team-group-logo="moon-lies"] img{transform:scale(1.16);transform-origin:top center}
    .team-group-logo[data-team-group-logo="hime-snapdragon"] img,.team-group-logo[data-team-group-logo="white-raven"] img{transform:scale(1.34);transform-origin:top center}

    .team-group-accordion>.config-character-grid{grid-template-columns:repeat(auto-fill,minmax(142px,1fr))}
    @media(max-width:720px){
      #charList.savior-list,.config-character-list{padding:5px}.team-group-card-grid{gap:5px}.team-group-card-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}

    }
  </style>`);

  function enhanceCharacterGroupSelector(host){
    if(!host)return;
    let cardGrid=host.querySelector(':scope > .team-group-card-grid');
    if(!cardGrid){
      const directSections=[...host.querySelectorAll(':scope > section.savior-group,:scope > section.config-character-group')];
      if(!directSections.length)return;
      cardGrid=document.createElement('div');
      cardGrid.className='team-group-card-grid';
      const fragment=document.createDocumentFragment();
      directSections.forEach(section=>fragment.append(section));
      cardGrid.append(fragment);
      host.prepend(cardGrid);
    }
    const sections=[...cardGrid.querySelectorAll(':scope > section.savior-group,:scope > section.config-character-group,:scope > .team-group-card-row > section.savior-group,:scope > .team-group-card-row > section.config-character-group')];
    const sectionForGroup=group=>sections.find(section=>section.querySelector(':scope > h3')?.textContent.trim()===(isJa()?group[2]:group[1]));
    const orderedSections=[...ALL_CHARACTER_GROUPS.map(sectionForGroup).filter(Boolean),...sections.filter(section=>!ALL_CHARACTER_GROUPS.some(group=>sectionForGroup(group)===section))];
    const rows=[...cardGrid.querySelectorAll(':scope > .team-group-card-row')];
    if(!rows.length||orderedSections.some((section,index)=>sections[index]!==section)){
      const fragment=document.createDocumentFragment();
      const perRow=window.matchMedia('(max-width:720px)').matches?2:3;
      for(let index=0;index<orderedSections.length;index+=perRow){
        const row=document.createElement('div');
        row.className='team-group-card-row';
        orderedSections.slice(index,index+perRow).forEach(section=>row.append(section));
        fragment.append(row);
      }
      cardGrid.replaceChildren(fragment);
    }
    sections.forEach(section=>{
      const heading=section.querySelector(':scope > h3');
      const content=section.querySelector(':scope > .savior-group-characters,:scope > .config-character-grid');
      const group=groupForHeading(heading?.textContent.trim());
      if(!heading||!content||!group)return;
      section.classList.add('team-group-accordion');
      heading.className='team-group-heading';
      if(!heading.querySelector('[data-team-group-toggle]')){
        const icon=TEAM_GROUP_ICONS[group[0]];
        const previews=groupPreviewMembers(group).map(character=>`<img class="avatar" src="${portrait(character)}" alt="" title="${esc(charName(character))}" loading="lazy">`).join('');
        heading.innerHTML=`<button type="button" class="team-group-toggle" data-team-group-toggle="${group[0]}" aria-expanded="false">${icon?`<span class="team-group-logo" data-team-group-logo="${group[0]}"><img src="${icon}" alt="" loading="lazy"></span>`:'<span class="team-group-logo-spacer" aria-hidden="true"></span>'}<span class="team-group-label">${esc(heading.textContent.trim())}</span>${previews?`<span class="team-group-members">${previews}</span>`:''}</button>`;
      }
      content.dataset.teamGroupContent=group[0];
      if(!section.classList.contains('is-open'))content.hidden=true;
    });
  }

  function enhanceAllCharacterGroupSelectors(){
    enhanceCharacterGroupSelector(document.getElementById('charList'));
    enhanceCharacterGroupSelector(document.getElementById('configCharacterList'));
    enhanceCharacterGroupSelector(document.getElementById('gCharacterList'));
    enhanceCharacterGroupSelector(document.getElementById('fCharacterList'));
  }

  document.addEventListener('click',event=>{
    const toggle=event.target.closest('[data-team-group-toggle]');
    if(!toggle)return;
    const section=toggle.closest('.team-group-accordion'),cardRow=section?.closest('.team-group-card-row'),cardGrid=cardRow?.parentElement;
    if(!section||!cardRow||!cardGrid)return;
    const content=cardGrid.querySelector(`[data-team-group-content="${toggle.dataset.teamGroupToggle}"]`);
    const open=content?.hidden;
    cardGrid.querySelectorAll('.team-group-accordion').forEach(group=>{
      const groupToggle=group.querySelector('[data-team-group-toggle]');
      const groupContent=cardGrid.querySelector(`[data-team-group-content="${groupToggle?.dataset.teamGroupToggle}"]`);
      const isOpen=group===section&&open;
      group.classList.toggle('is-open',isOpen);
      if(groupContent){
        groupContent.hidden=!isOpen;
        groupContent.classList.toggle('team-group-detail',isOpen);
        if(isOpen)cardRow.after(groupContent);else group.append(groupContent);
      }
      group.querySelector('[data-team-group-toggle]')?.setAttribute('aria-expanded',String(group===section&&open));
    });
  });

  ['charList','configCharacterList','gCharacterList','fCharacterList'].forEach(id=>{
    const host=document.getElementById(id);
    if(host)new MutationObserver(()=>queueMicrotask(enhanceAllCharacterGroupSelectors)).observe(host,{childList:true});
  });
  new MutationObserver(()=>queueMicrotask(enhanceAllCharacterGroupSelectors)).observe(document.querySelector('main'),{childList:true,subtree:true});
  document.getElementById('language')?.addEventListener('change',()=>requestAnimationFrame(enhanceAllCharacterGroupSelectors));
  window.__enhanceCharacterGroupSelector=enhanceCharacterGroupSelector;
  enhanceAllCharacterGroupSelectors();
})();
</script>

<script>
(()=>{
  const compareView=document.getElementById('compareView');
  if(!compareView)return;
  document.head.insertAdjacentHTML('beforeend',`<style>
    .compare-route-control{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end;min-width:0}
    .compare-route-edit{min-height:34px;padding:5px 8px;white-space:nowrap;font-size:11px}
    .compare-route-edit:disabled{cursor:not-allowed;opacity:.5}
    @media(max-width:720px){.compare-route-control{gap:4px}.compare-route-edit{min-height:29px;padding:4px 5px;font-size:9px}}
  </style>`);

  const editLabel=()=>isJa()?'編集':'编辑';
  const unavailableTitle=()=>isJa()?'共通テンプレートはキャラ別ルート編集では変更できません':'通用模板不能在角色路线编辑页中修改';
  const editRouteTitle=()=>isJa()?'このキャラのルートを編集':'编辑该角色的路线';

  function routeEditorRef(characterId,source){
    if(!characterId||!String(source).startsWith('path:'))return null;
    const character=characterById[characterId];
    if(!character)return null;
    const path=paths(character)[+String(source).slice(5)];
    const ref=configRefs(character).find(item=>item.path===path);
    return character&&ref?{character,ref}:null;
  }

  function openComparisonRouteEditor(characterId,source){
    const target=routeEditorRef(characterId,source);
    if(!target)return;
    configCharacterId=target.character.id;
    configRef={kind:target.ref.kind,index:target.ref.index};
    loadDraft(target.character);
    document.querySelector('[data-view="config"]')?.click();
    document.getElementById('configView')?.scrollIntoView?.({behavior:'smooth',block:'start'});
  }

  function addComparisonRouteEditors(){
    const comparison=comparisonState();
    compareView.querySelectorAll('select[data-cmp-field="source"],select[data-cmp-shared="sharedSource"]').forEach(select=>{
      const label=select.closest('label');
      if(!label)return;
      let control=label.parentElement;
      if(!control?.classList.contains('compare-route-control')){
        control=document.createElement('div');
        control.className='compare-route-control';
        label.before(control);
        control.append(label);
        const button=document.createElement('button');
        button.type='button';
        button.className='compare-route-edit';
        control.append(button);
      }
      const button=control.querySelector('.compare-route-edit');
      const row=select.closest('[data-cmp-row]');
      const item=comparison.rows.find(entry=>entry.id===row?.dataset.cmpRow);
      const characterId=comparison.mode==='same-character'?comparison.sharedCharacterId:item?.characterId;
      const editable=routeEditorRef(characterId,select.value);
      button.textContent=editLabel();
      button.disabled=!editable;
      button.title=editable?editRouteTitle():unavailableTitle();
      button.dataset.cmpEditCharacter=characterId||'';
      button.dataset.cmpEditSource=select.value;
    });
  }

  compareView.addEventListener('click',event=>{
    const button=event.target.closest('.compare-route-edit');
    if(!button||button.disabled)return;
    openComparisonRouteEditor(button.dataset.cmpEditCharacter,button.dataset.cmpEditSource);
  });
  compareView.addEventListener('change',()=>requestAnimationFrame(addComparisonRouteEditors));
  new MutationObserver(addComparisonRouteEditors).observe(compareView,{childList:true,subtree:true});
  document.getElementById('language')?.addEventListener('change',()=>requestAnimationFrame(addComparisonRouteEditors));
  addComparisonRouteEditors();
})();
</script>
