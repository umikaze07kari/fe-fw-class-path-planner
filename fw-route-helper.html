 if(!path) return '<span class="muted">暂无公开推荐路线</span>';
 return path.steps.map(step=>{
   const cls=classById[step.classId], r=parseReq(cls?.requirement||"");
   const mainMissing=r.main.map(x=>shortage(x,skills)).filter(Boolean);
   const choiceMissing=r.choice.map(x=>shortage(x,skills));
   const choiceOk=!r.choice.length||choiceMissing.some(x=>!x);
   const gaps=[...mainMissing,...(choiceOk?[]:[`任选 ${choiceMissing.join(" / ")}`])];
   const short=[r.main.map(x=>skillShort(x.skill)+x.grade).join(" "),r.choice.map(x=>skillShort(x.skill)+x.grade).join("/")].filter(Boolean).join(" ");
   const tier=compactTier(step.tier);
   return `<span class="class-node slot-${tierSlot(step.tier)} ${gaps.length?"gap":"ok"}" title="${esc((cls?.requirement||"未记录门槛")+(gaps.length?(isJa()?"｜不足：":"｜待加练：")+gaps.join("；"):(isJa()?"｜達成":"｜已达标")))}"><b>${esc(tier)}·${esc(stepName(step))}</b>${short?`<small>${esc(short)}</small>`:""}</span>`;
 }).join("");
}
function skillFocus(path, skills) {
 const focus={}; if(!path) return focus;
 const add=req=>{if(!focus[req.skill]||gradeValue(req.grade)>gradeValue(focus[req.skill]))focus[req.skill]=req.grade;};
 for(const step of path.steps){
   const r=parseReq((classById[step.classId]||{}).requirement||"");
   r.main.forEach(add);
   if(r.choice.length){
     const best=r.choice.slice().sort((a,b)=>(gradeValue(a.grade)-gradeValue(skills[a.skill]))-(gradeValue(b.grade)-gradeValue(skills[b.skill]))||gradeValue(skills[b.skill])-gradeValue(skills[a.skill]))[0];
     if(best)add(best);
   }
 }
 return focus;
}
function memberCard(m){
 const c=characterById[m.id];if(!c)return "";m.skills||=blankSkills();const paths=pathOptions(c), p=paths[m.path]||paths[0];
 const pathSelect=`<select data-action="path" data-id="${c.id}">${paths.map((x,i)=>`<option value="${i}" ${i===m.path?"selected":""}>${esc(x.steps?.length?stepName(x.steps.at(-1)):(isJa()?"ルート ":"路线 ")+(i+1))}</option>`).join("")}<option value="custom">${isJa()?"＋ ルートを自作…":"＋ 自定义路线…"}</option></select>`;
 const focus=skillFocus(p,m.skills);
 const skillInputs=SKILLS.map(s=>{const target=focus[s], state=target?(gradeValue(m.skills[s])<gradeValue(target)?"need":"met"):"";const tip=target?`${skillName(s)}：${isJa()?"現在":"当前"} ${m.skills[s]}，${isJa()?"目標":"路线目标"} ${target}`:skillName(s);return `<label class="${state}" title="${tip}">${skillShort(s)}<select data-action="skill" data-id="${c.id}" data-skill="${s}">${GRADES.map(g=>`<option ${m.skills[s]===g?"selected":""}>${g}</option>`).join("")}</select></label>`;}).join("");
 return `<article class="compact-member"><div class="compact-who"><img class="avatar" src="${portrait(c)}" alt="" loading="lazy"><b title="${esc(charName(c))}">${esc(charName(c))}</b></div><div class="compact-route">${pathSelect}</div><div class="quick-skills">${skillInputs}</div><div class="node-line">${compactNodes(p,m.skills)}</div><button class="danger" data-action="remove" data-id="${c.id}">${isJa()?"外す":"移出"}</button></article>`;
}
function render(){
 renderChrome();
 document.getElementById("routes").innerHTML=ROUTES.map((r,i)=>`<button class="route route-${i} ${r===active?"active":""}" data-route="${r}"><span class="route-full">${routeName(r)}</span><span class="route-short">${mobileRouteName(r)}</span><small> · ${state.teams[r].length}</small></button>`).join("");
 const q=document.getElementById("search").value.trim(), available=CHARACTERS.filter(c=>isRouteAvailable(c,active)).map(c=>({c,info:recruitInfo(c,active)})).sort((a,b)=>a.info.order-b.info.order||charName(a.c).localeCompare(charName(b.c),isJa()?"ja":"zh-CN")), list=available.filter(x=>!q||c.name.includes(q)||charName(c).includes(q));
 document.getElementById("charList").innerHTML=list.map(({c,info})=>`<div class="char"><img class="avatar" src="${portrait(c)}" alt="" loading="lazy"><span title="${esc(charName(c))}">${esc(charName(c))}</span><small>${esc(info.label)}</small><button class="${state.teams[active].some(x=>x.id===c.id)?"":"primary"}" data-add="${c.id}" ${state.teams[active].some(x=>x.id===c.id)?"disabled":""}>${state.teams[active].some(x=>x.id===c.id)?(isJa()?"加入済":"已加入"):(isJa()?"加入":"加入")}</button></div>`).join("");
 document.getElementById("count").textContent=isJa()?`${list.length} / ${available.length} 人`:`${list.length} / ${available.length} 名可用角色`;
 const nodeHead=isJa()?`<div class="node-head"><b>兵種・必要技能</b><span>初 Lv5</span><span>中 Lv20</span><span>上 Lv35</span><span>最 Lv45</span><span>神 特殊</span></div>`:`<div class="node-head"><b>职业节点 · 技能门槛</b><span>初 Lv5</span><span>中 Lv20</span><span>上 Lv35</span><span>最 Lv45</span><span>神 特殊</span></div>`;
 const team=state.teams[active];document.getElementById("members").innerHTML=team.length?`<div class="member-scroll"><div class="compact-members"><div class="compact-head"><span>${isJa()?"キャラ":"角色"}</span><span>${isJa()?"おすすめルート":"推荐路线"}</span><span>${isJa()?"技能Lv":"技能等级"}</span>${nodeHead}<span></span></div>${team.map(memberCard).join("")}</div></div>`:`<div class="panel empty">${isJa()?`まだキャラがいません。上のリストから「${routeName(active)}」に追加してください。`:`还没有登记角色。展开上方名单，将角色加入“${active}”。`}</div>`;
}
function renderChrome(){
 const ja=isJa(); document.documentElement.lang=ja?"ja":"zh-CN";
 document.getElementById("language").value=state.lang;
 document.getElementById("languageCaption").textContent=ja?"表示":"语言";
 document.title=ja?"万紫千紅・兵種ルート育成アシスタント":"万缕千丝 · 职业路线升级助手";
 document.getElementById("appTitle").textContent=document.title;
 document.getElementById("subtitle").textContent=ja?"育成ルートと転職に必要な技能をまとめて確認":"培养路线与转职技能需求对照";
 document.getElementById("teamTab").textContent=ja?"部隊一覧":"队伍总览"; document.getElementById("configTab").textContent=ja?"ルート設定":"路线配置";
 document.getElementById("search").placeholder=ja?"キャラ名を検索":"搜索角色名称";
 document.getElementById("export").textContent=ja?"バックアップを書き出す":"导出备份"; document.getElementById("import").textContent=ja?"バックアップを読み込む":"导入备份";
 document.getElementById("rosterSummary").textContent=ja?"＋ キャラ一覧からこのルートへ追加":"＋ 从角色名单中加入当前线路";
 document.getElementById("membersHeading").textContent=ja?"所持キャラ":"已拥有角色";
 document.getElementById("configCharacterLabel").textContent=ja?"キャラ":"角色"; document.getElementById("classPickerLabel").textContent=ja?"兵種ノード":"职业节点";
 document.getElementById("addClassNode").textContent=ja?"＋ ノードを追加":"＋ 加入节点"; document.getElementById("saveCustomPath").textContent=ja?"自作ルートを保存":"保存自定义路线";
 document.getElementById("configHint").textContent=ja?"兵種ノードを順番に追加して保存します。自作ルートは部隊一覧の「おすすめルート」に表示されます。":"按顺序添加职业节点后保存。自定义路线会出现在队伍总览的“推荐路线”下拉框中。";
 document.getElementById("footer").innerHTML=ja?`データ出典：<a href="https://fire-emblem-fw.site/characters.html" target="_blank" rel="noopener">キャラ一覧</a>、<a href="https://fire-emblem-fw.site/classes.html" target="_blank" rel="noopener">兵種一覧</a>（取得日：2026-09-30）。入力データはこのブラウザのみに保存されます。「いずれか1つ」は1項目を満たせば達成と判定します。<br>ゲーム画像と名称の著作権は © Nintendo / INTELLIGENT SYSTEMS に帰属します。本サイトは紹介・攻略目的のみで利用しています。`:`数据来源：<a href="https://fire-emblem-fw.site/characters.html" target="_blank" rel="noopener">角色一览</a>、<a href="https://fire-emblem-fw.site/classes.html" target="_blank" rel="noopener">职业一览</a>（获取日期：2026-09-30）。登记数据仅保存在此浏览器；“任选其一”会按任意一项达标判断。<br>游戏图像与名称版权归 © Nintendo / INTELLIGENT SYSTEMS 所有，本站仅作介绍与攻略用途。`;
}
document.getElementById("routes").onclick=e=>{const r=e.target.closest("[data-route]")?.dataset.route;if(r){active=r;render();}};
document.getElementById("search").oninput=render;
document.getElementById("language").onchange=e=>{state.lang=e.target.value==="ja"?"ja":"zh";save();render();if(!document.getElementById("configView").hidden)renderConfig();};
document.getElementById("charList").onclick=e=>{const id=e.target.dataset.add;if(id)add(id);};
document.getElementById("members").onchange=e=>{const el=e.target, id=el.dataset.id, m=state.teams[active].find(x=>x.id===id);if(!m)return;if(el.dataset.action==="path"){if(el.value==="custom"){openCustomConfig(id);return;}m.path=+el.value;m.target=(pathOptions(characterById[id])[m.path]?.steps.length||1)-1;}if(el.dataset.action==="target")m.target=+el.value;if(el.dataset.action==="skill")m.skills[el.dataset.skill]=el.value;save();render();};
document.getElementById("members").onclick=e=>{const el=e.target;if(el.dataset.action==="remove")remove(el.dataset.id);};
document.getElementById("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="万缕千丝-培养路线登记.json";a.click();URL.revokeObjectURL(a.href);};
document.getElementById("import").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x.teams)throw Error();state=x;ROUTES.forEach(r=>state.teams[r] ||= []);state.customPaths ||= {};state.lang=state.lang==="ja"?"ja":"zh";save();render();renderConfig();}catch{alert(isJa()?"バックアップファイルが無効です。":"备份文件无效，未导入。");}};reader.readAsText(f);e.target.value="";};
let configCharacterId=CHARACTERS[0].id, draftSteps=[];
function openCustomConfig(id){configCharacterId=id;draftSteps=[];document.querySelectorAll(".view-tabs button").forEach(x=>x.classList.toggle("active",x.dataset.view==="config"));document.getElementById("teamView").hidden=true;document.getElementById("configView").hidden=false;renderConfig();document.getElementById("configView").scrollIntoView?.({behavior:"smooth",block:"start"});}
const classStep=id=>{const c=classById[id];return c?{tier:c.tier,name:c.name,classId:c.id}:null;};
const builtInPaths=c=>c.paths?.length?c.paths:(c.path?.length?[{src:"默认推荐",steps:c.path}]:[]);
const routeText=steps=>steps.map(stepName).join(" → ");
function renderConfig(){
 const picker=document.getElementById("configCharacter"), classPicker=document.getElementById("classPicker");
 picker.innerHTML=CHARACTERS.slice().sort((a,b)=>charName(a).localeCompare(charName(b),isJa()?"ja":"zh-CN")).map(c=>`<option value="${c.id}">${esc(charName(c))}</option>`).join("");classPicker.innerHTML=CLASSES.filter(c=>c.requirement!=="—").map(c=>`<option value="${c.id}">${esc(tierName(c.tier))} · ${esc(className(c))}</option>`).join("");
 picker.value=configCharacterId; const c=characterById[configCharacterId]; if(!c)return;
 document.getElementById("pathBuilder").innerHTML=`<h3>${isJa()?"編集中：":"正在编辑："}${esc(charName(c))}</h3><div class="path-builder-row">${draftSteps.length?draftSteps.map((id,i)=>{const s=classStep(id),cls=classById[id];return `<span class="config-node">${esc(tierName(s.tier))}·${esc(className(cls,s.name))}<button data-remove-draft="${i}" title="${isJa()?"削除":"移除"}">×</button></span>${i<draftSteps.length-1?'<span class="arrow">→</span>':""}`;}).join(""):`<span class="muted">${isJa()?"上で兵種を選び、実際の転職順にノードを追加してください。":"从上方选择职业后加入节点；按实际转职顺序排列。"}</span>`}</div>`;
 const publicPaths=builtInPaths(c), custom=state.customPaths[c.id]||[];
 document.getElementById("configExisting").innerHTML=`<h3>${isJa()?"保存済みルート":"已有路线"}</h3>${publicPaths.length?publicPaths.map(p=>`<div class="saved-path"><small>${isJa()?"サイトおすすめ":"站点推荐"}</small><span>${esc(routeText(p.steps))}</span></div>`).join(""):`<div class='muted'>${isJa()?"サイトおすすめはありません":"站点暂无推荐路线"}</div>`}${custom.map((p,i)=>`<div class="saved-path"><small>${isJa()?"自作":"自定义"}</small><span>${esc(routeText(p.steps))}</span><button class="danger" data-delete-custom="${i}">${isJa()?"削除":"删除"}</button></div>`).join("")}`;
}
document.querySelector(".view-tabs").onclick=e=>{const b=e.target.closest("[data-view]");if(!b)return;const view=b.dataset.view;document.querySelectorAll(".view-tabs button").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("teamView").hidden=view!=="team";document.getElementById("configView").hidden=view!=="config";if(view==="config")renderConfig();};
document.getElementById("configCharacter").onchange=e=>{configCharacterId=e.target.value;draftSteps=[];renderConfig();};
document.getElementById("addClassNode").onclick=()=>{draftSteps.push(document.getElementById("classPicker").value);renderConfig();};
document.getElementById("pathBuilder").onclick=e=>{const i=e.target.dataset.removeDraft;if(i!==undefined){draftSteps.splice(+i,1);renderConfig();}};
document.getElementById("saveCustomPath").onclick=()=>{if(!draftSteps.length){alert("请至少加入一个职业节点。");return;}const steps=draftSteps.map(classStep).filter(Boolean);state.customPaths[configCharacterId] ||= [];state.customPaths[configCharacterId].push({src:"自定义",steps});draftSteps=[];save();render();renderConfig();};
document.getElementById("configExisting").onclick=e=>{const i=e.target.dataset.deleteCustom;if(i===undefined)return;state.customPaths[configCharacterId].splice(+i,1);save();render();renderConfig();};
render();
</script>
</body></html>
